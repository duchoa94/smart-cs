steps:
  # Build the API image, pulling the previous :latest for layer cache
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - --cache-from
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:latest'
      - --tag
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$COMMIT_SHA'
      - --tag
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:latest'
      - --file
      - apps/api/Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-api
    args:
      - push
      - --all-tags
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed

substitutions:
  # Override these in your Cloud Build trigger or via --substitutions on CLI
  _REGION: asia-southeast1
  _AR_REPO: smart-cs        # Artifact Registry repository name
  _SERVICE_NAME: smart-cs-api

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
